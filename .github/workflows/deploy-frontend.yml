name: Deploy Angular PWA to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "fe/**"
      - ".github/workflows/deploy-fe.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: fe

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        # Use the exact repository name here, or "/" once you have a custom domain.
        run: npm run build -- --configuration=production --base-href=/cheap-food/

      - name: Make deep links work on GitHub Pages
        # Pages has no single-page-app fallback: unknown paths return 404.html,
        # so serve the app shell there.
        run: |
          ls -R dist/
          cp dist/cheapdish-front/browser/index.html dist/cheapdish-front/browser/404.html
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Relative to the repository root (the defaults above only affect "run" steps).
          path: fe/dist/cheapdish-front/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4