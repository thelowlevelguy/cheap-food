name: Deploy Angular PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "fe/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Build Angular application
        working-directory: fe
        run: npm run build -- --configuration=production --base-href=/cheap-food/

      - name: Inspect build output
        working-directory: fe
        run: |
          echo "Checking Angular build output..."
          find dist -maxdepth 4 -type f -name index.html
          test -f dist/cheapdish-front/browser/index.html

      - name: Prepare GitHub Pages artifact
        working-directory: fe
        run: |
          cp dist/cheapdish-front/browser/index.html \
             dist/cheapdish-front/browser/404.html
          touch dist/cheapdish-front/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: fe/dist/cheapdish-front/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4